[workspace]
members = [
  "crates/common",
  "crates/protocol",
  "crates/database",
  "crates/login-server",
  "crates/supernode",
  "crates/relay-node",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["skype-rs contributors"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "6"
toml = "0.8"
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
